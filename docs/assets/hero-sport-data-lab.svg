    <circle cx="24" cy="40" r="11" fill="#ffffff" stroke="#e2231b" stroke-width="6"/>
    <circle cx="220" cy="92" r="11" fill="#ffffff" stroke="#111111" stroke-width="6" opacity="0.22"/>
    <circle cx="194" cy="164" r="16" fill="#ffffff" stroke="#e2231b" stroke-width="6"/>
