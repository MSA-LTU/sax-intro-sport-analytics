<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" role="img" aria-labelledby="title desc">
  <title id="title">Sport analytics learning artwork</title>
  <desc id="desc">A clean sport analytics composition with data cards, a field diagram, chart marks, and a red analysis trail.</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#101010" flood-opacity="0.08"/>
    </filter>
    <pattern id="fine-grid" width="78" height="54" patternUnits="userSpaceOnUse">
      <path d="M78 0H0V54" fill="none" stroke="#e8e8e8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="980" height="280" fill="#ffffff"/>
  <rect x="24" y="16" width="932" height="228" rx="20" fill="url(#fine-grid)" opacity="0.7"/>
  <path d="M52 206H930" stroke="#111111" stroke-width="2" opacity="0.12"/>
  <path d="M72 92H920" stroke="#111111" stroke-width="2" opacity="0.1"/>

  <g transform="translate(86 44)" filter="url(#soft-shadow)">
    <path d="M26 20v144" stroke="#111111" stroke-width="2" opacity="0.5"/>
    <path d="M26 164h142" stroke="#111111" stroke-width="2" opacity="0.45"/>
    <rect x="48" y="108" width="20" height="56" rx="5" fill="#d8d8d8"/>
    <rect x="78" y="72" width="20" height="92" rx="5" fill="#b9b9b9"/>
    <rect x="108" y="38" width="20" height="126" rx="5" fill="#111111"/>
    <rect x="138" y="91" width="20" height="73" rx="5" fill="#e2231b"/>
    <circle cx="26" cy="92" r="18" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/>
    <path d="M30 82l-11 10 11 10z" fill="#111111"/>
    <rect x="-7" y="0" width="66" height="28" rx="10" fill="#111111"/>
    <text x="26" y="18" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff">31%</text>
  </g>

  <g transform="translate(324 77)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="166" height="36" rx="9" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/>
    <rect x="16" y="13" width="12" height="12" rx="2" fill="#e2231b"/>
    <text x="42" y="22" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#727272">load rows</text>

    <rect x="52" y="60" width="228" height="42" rx="10" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/>
    <rect x="68" y="75" width="12" height="12" rx="2" fill="#111111"/>
    <text x="94" y="84" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#727272">group by team</text>

    <rect x="-28" y="126" width="186" height="40" rx="10" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/>
    <rect x="-12" y="140" width="12" height="12" rx="2" fill="#e2231b"/>
    <text x="14" y="149" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#727272">summarise</text>

