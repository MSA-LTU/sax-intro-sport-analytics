  <g transform="translate(792 209)" filter="url(#soft-shadow)">
    <rect x="0" y="12" width="34" height="34" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/>
    <rect x="42" y="-2" width="34" height="34" rx="8" fill="#111111"/>
